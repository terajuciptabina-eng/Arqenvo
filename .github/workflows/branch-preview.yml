name: Publish ARQENVO Branch Preview
on:
  push:
    branches:
      - "feat/model-history-and-wall-joins"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout tested branch
        uses: actions/checkout@v4
        with:
          ref: feat/model-history-and-wall-joins
          path: preview-src
      - name: Add branch app under /preview/
        run: |
          mkdir -p site/preview
          cp preview-src/index.html site/preview/index.html
          cp -R preview-src/src site/preview/src
          cp -R preview-src/assets site/preview/assets
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production site plus isolated preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview without replacing production app files
        id: deployment
        uses: actions/deploy-pages@v4
