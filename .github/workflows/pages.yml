name: Publish ARQENVO production with PR #6 isolated preview to GitHub Pages
on:
  push:
    branches: ["main", "feat/model-history-and-wall-joins"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site from main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout PR #6 branch for isolated preview
        uses: actions/checkout@v4
        with:
          ref: fix/archicad-style-element-selection
          path: preview-src
      - name: Assemble production site plus isolated preview
        run: |
          echo "Preview source: fix/archicad-style-element-selection (current branch HEAD)"
          mkdir -p preview
          cp preview-src/index.html preview/index.html
          cp -R preview-src/src preview/src
          if [ -d preview-src/assets ]; then cp -R preview-src/assets preview/assets; fi
          touch .nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production site plus isolated preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
