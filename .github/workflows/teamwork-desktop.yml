name: Teamwork Desktop Host Builds
on:
  push:
    branches: [main]
    paths: ["desktop/teamwork-host/**","server/teamwork-host.js","src/**","index.html","assets/**","download/**",".github/workflows/teamwork-desktop.yml"]
  pull_request:
    paths: ["desktop/teamwork-host/**","server/teamwork-host.js","src/**","index.html","assets/**","download/**",".github/workflows/teamwork-desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win
            artifact: windows
          - os: macos-latest
            command: build:mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop/teamwork-host
      - name: Build desktop installer
        run: npm run ${{ matrix.command }}
        working-directory: desktop/teamwork-host
      - name: Give installers stable download names
        shell: bash
        run: |
          if [ "${{ matrix.artifact }}" = "windows" ]; then
            find desktop/teamwork-host/dist -maxdepth 1 -type f -iname '*.exe' -exec cp "{}" desktop/teamwork-host/dist/ARQENVO-Teamwork-Host-Windows.exe \;
          else
            find desktop/teamwork-host/dist -maxdepth 1 -type f -iname '*.dmg' -exec cp "{}" desktop/teamwork-host/dist/ARQENVO-Teamwork-Host-macOS.dmg \;
          fi
          test -f desktop/teamwork-host/dist/ARQENVO-Teamwork-Host-${{ matrix.artifact == 'windows' && 'Windows.exe' || 'macOS.dmg' }}
      - uses: actions/upload-artifact@v4
        with:
          name: arqenvo-teamwork-host-${{ matrix.artifact }}
          path: desktop/teamwork-host/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable installers to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teamwork-host-latest
          name: ARQENVO Teamwork Host — Latest
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            desktop/teamwork-host/dist/ARQENVO-Teamwork-Host-Windows.exe
            desktop/teamwork-host/dist/ARQENVO-Teamwork-Host-macOS.dmg
